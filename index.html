</div>

            <section><a href="#nv-foto" class="btn_look">NV-FOTO</a><a href="#todo_app" class="btn_look">ToDo App</a></section>

            <h2 id="nv-foto">NV-FOTO</h2>
            <section class="flex_row space_between">
                <div class="nv-foto-karrusel">
                    <div class="slides">
                        <img class="slide active" src="/slide_img/nv-index.png" alt="">
                        <img class="slide" src="slide_img/Designsystem.png" alt="">

                    </div>

                        <span class="dot active"></span>

                    </div>

<p data-i18n="to_do_text_2"></p>
<p data-i18n="to_do_text_3"></p>

      <button id="done" class="tab">DONE</button>
    </div>
    <section class="todo_section">
      <div id="add_section">
        <input id="input_text" placeholder="Add a task" type="input felt" />
        <input id="input_number" placeholder="Amount" type="text" />
        <img id="submit_task" src="../todo_img/add.png" class="icon" alt="" />
      </div>

      <ul class="task_container"></ul>
    </section>

    <section class="done_section display_none">
      <ul class="done_container"></ul>
    </section>

    <footer></footer>
